<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pengguna - ReFood</title>
    <link rel="stylesheet" href="./app.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <refood-sidebar></refood-sidebar>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="date-display">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="currentDate">Kamis, 20 September 2026</span>
                </div>
                <div class="topbar-right">
                    <div class="avatar-top">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
            </header>

            <div class="pengguna-page-container">
                <!-- Page Header with Summary Card -->
                <div class="pengguna-header-row">
                    <div class="header-text">
                        <h1>Manajemen Pengguna</h1>
                        <p>Kelola & pantau seluruh pengguna terdaftar di aplikasi ReFood.</p>
                    </div>
                    
                    <div class="summary-card">
                        <div class="summary-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        </div>
                        <div class="summary-details">
                            <div class="summary-label">Total Pengguna Terdaftar</div>
                            <div class="summary-value">
                                <span class="big-number">1.428</span>
                                <span class="unit">Akun</span>
                            </div>
                        </div>
                        <div class="summary-badge">
                            <span class="badge-growth">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                                + 12 %
                            </span>
                            <span class="badge-sub">Bulan Ini</span>
                        </div>
                    </div>
                </div>

                <!-- Filters & Search -->
                <div class="filter-bar">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Cari pengguna...">
                    </div>
                    
                    <div class="chip-group">
                        <button class="chip active" id="filterSemua">
                            Semua <span class="chip-count">1.428</span>
                        </button>
                        <button class="chip" id="filterToko">
                            Toko Terverifikasi <span class="chip-count">174</span>
                        </button>
                        <button class="chip" id="filterDiblokir">
                            Diblokir <span class="chip-count">5</span>
                        </button>
                    </div>
                </div>

                <!-- Data Table List -->
                <div class="table-container">
                    <div class="table-header">
                        <div class="col-pengguna">PENGGUNA</div>
                        <div class="col-tipe">TIPE IDENTITAS</div>
                        <div class="col-lokasi">LOKASI</div>
                        <div class="col-status">STATUS</div>
                    </div>
                    
                    <div class="table-body" id="usersList">
                        <!-- Rendered by JS -->
                        <div style="text-align:center; padding:40px; color:#757575;">Memuat data...</div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination-container">
                    <div class="pagination-info" id="paginationInfo">
                        Menampilkan 10 dari 1.428 Semua
                    </div>
                    <div class="pagination-controls">
                        <button class="page-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">3</button>
                        <button class="page-btn">4</button>
                        <button class="page-btn">5</button>
                        <span class="page-dots">...</span>
                        <button class="page-btn">17</button>
                        <button class="page-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./app.js"></script>
</body>
</html>
