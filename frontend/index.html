<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReFood</title>
    <link rel="stylesheet" href="./app.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <!-- Top Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-icon">
                <img src="./assets/logo.jpg" alt="ReFood" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="logo-text">
                <span class="logo-orange">Re</span><span class="logo-green">Food</span>
            </div>
            <span class="tagline">Don't waste it, ReFood it!</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="login-card">
            <!-- Left Side (Green) -->
            <div class="card-left">
                <div class="left-header">
                    <div class="logo-icon bg-white">
                        <img src="./assets/logo.jpg" alt="ReFood" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;">
                    </div>
                    <div>
                        <h2 class="left-logo-text">ReFood</h2>
                        <p class="left-tagline">Don't waste it, ReFood it!</p>
                    </div>
                </div>

                <h1 class="left-title">Setiap Porsi Berarti: Bantu Kurangi Sampah Makanan Bersama ReFood!</h1>
                
                <div class="image-placeholder">
                    <img src="./assets/food-box.jpg" alt="Food Box" class="food-image">
                </div>
            </div>

            <!-- Right Side (White) -->
            <div class="card-right">
                <div class="right-content">
                    <h2 class="right-title">Masuk ke Akun Anda</h2>
                    <p class="right-subtitle">Masuk ke akun Anda dan temukan makanan bernilai tinggi yang siap diselamatkan.</p>
                    
                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="username">Username/Email</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </span>
                                <input type="text" id="username" name="username" placeholder="contoh@gmail.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Kata Sandi</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="password" name="password" placeholder="••••••••" required>
                                <span class="input-icon-right" id="togglePassword">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </span>
                            </div>
                        </div>

                        <div class="forgot-password">
                            <a href="#">Lupa Kata Sandi?</a>
                        </div>

                        <div id="errorMessage" class="error-message" style="display: none;"></div>
                        <div id="successMessage" class="success-message" style="display: none;"></div>

                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span>Masuk Sekarang</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <a href="#">Syarat & Ketentuan</a>
        <a href="#">Kebijakan Privasi</a>
    </footer>

    <script src="./app.js"></script>
</body>
</html>
