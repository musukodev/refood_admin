<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Masuk - ReFood</title>
    <link rel="stylesheet" href="./app.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <refood-sidebar></refood-sidebar>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="date-display">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="currentDate">Sabtu, 17 Oktober 2026</span>
                </div>
                <div class="topbar-right">
                    <div class="avatar-top">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
            </header>

            <div class="laporan-page-container">
                <!-- Header Card: Laporan Masuk -->
                <div class="laporan-header-card">
                    <div class="laporan-header-content">
                        <h1 class="laporan-header-title">Laporan Masuk</h1>
                        <p class="laporan-header-subtitle">Kelola dan tindak lanjuti keluhan dan pengunggah produk.</p>
                    </div>
                    <div class="lap-pending-box">
                        <div class="lap-pending-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        </div>
                        <div class="lap-pending-text">
                            <strong>1</strong>
                            <span>Laporan Menunggu Tindakan</span>
                        </div>
                    </div>
                </div>

                <!-- Warning Alert: Daftar Laporan -->
                <div class="laporan-alert">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span class="laporan-alert-title">Daftar Laporan</span>
                </div>

                <!-- Info Row -->
                <div class="laporan-info-card">
                    <div class="laporan-col">
                        <div class="laporan-col-header">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            <span class="laporan-col-label">Pelapor:</span>
                        </div>
                        <span class="laporan-col-value">Holland Bakery</span>
                    </div>

                    <div class="laporan-col">
                        <div class="laporan-col-header">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <span class="laporan-col-label">Pengklaim Terlaporkan:</span>
                        </div>
                        <span class="laporan-col-value laporan-col-value-red">Siti Rahmawati</span>
                        <span class="laporan-col-code">(KODE 2146)</span>
                    </div>

                    <div class="laporan-col">
                        <div class="laporan-col-header">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                            <span class="laporan-col-label">Produk:</span>
                        </div>
                        <span class="laporan-col-value">Roti Pisang Cokelat (1 Porsi)</span>
                    </div>

                    <div class="laporan-col-action">
                        <button class="laporan-btn-detail" onclick="window.location.href = (window.location.protocol === 'file:') ? './detail-laporan.html' : '/detail-laporan'">
                            Lihat Detail Laporan
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="12" x2="16" y2="12"></line><polyline points="16 17 21 12 16 7"></polyline></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./app.js"></script>
</body>
</html>
