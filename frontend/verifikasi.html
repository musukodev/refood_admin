<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Toko - ReFood</title>
    <link rel="stylesheet" href="./app.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <refood-sidebar></refood-sidebar>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="date-display">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="currentDate">Kamis, 20 September 2026</span>
                </div>
                <div class="topbar-right">
                    <div class="avatar-top">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
            </header>

            <div class="verifikasi-page-container">
                <div class="page-header">
                    <h1>Verifikasi Toko</h1>
                    <p>Tinjau kelengkapan identitas toko untuk memberikan lencana resmi ReFood.</p>
                </div>

                <!-- Tabs -->
                <div class="tabs-container">
                    <button class="tab-btn active" id="tabMenunggu">
                        Menunggu <span class="tab-badge green" id="countMenunggu">3</span>
                    </button>
                    <button class="tab-btn" id="tabTerverifikasi">
                        Terverifikasi <span class="tab-badge gray" id="countTerverifikasi">20</span>
                    </button>
                </div>

                <!-- Lists Container -->
                <div class="list-container" id="storesList">
                    <!-- Loading state -->
                    <div style="text-align:center; padding:40px; color:#757575;">Memuat data...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="./app.js"></script>
</body>
</html>
